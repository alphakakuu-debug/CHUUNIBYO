<style>

/*==========================================================
    ADAM UtilityOS
    Theme
==========================================================*/

:root{

--cyan:#00F2FF;
--cyan2:#00D0DD;

--bg:rgba(0,0,0,.70);
--bg2:rgba(0,0,0,.45);

--white:#ffffff;
--red:#ff4040;
--yellow:#ffd84d;
--green:#40ff7b;

--radius:10px;

--border:
1px solid rgba(0,242,255,.25);

}

/*==========================================================
    Body
==========================================================*/

html,
body{

margin:0;
padding:0;

width:100%;
height:100%;

overflow:hidden;

background:#000;

color:var(--cyan);

font-family:
"Courier New",
monospace;

}

/*==========================================================
    Camera
==========================================================*/

#camera{

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

object-fit:cover;

z-index:1;

background:#000;

}

/*==========================================================
    HUD
==========================================================*/

#hud{

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

z-index:20;

padding:15px;

box-sizing:border-box;

display:flex;

flex-direction:column;

justify-content:space-between;

pointer-events:none;

}

/*==========================================================
    Row
==========================================================*/

.row{

display:flex;

justify-content:space-between;

align-items:flex-start;

gap:12px;

}

/*==========================================================
    Panel
==========================================================*/

.panel{

background:var(--bg);

border:var(--border);

border-left:

3px solid var(--cyan);

border-radius:

var(--radius);

backdrop-filter:

blur(8px);

padding:

10px;

box-sizing:border-box;

pointer-events:auto;

}

/*==========================================================
    Title
==========================================================*/

.title{

font-size:10px;

letter-spacing:2px;

color:

rgba(0,242,255,.75);

margin-bottom:6px;

display:block;

}

/*==========================================================
    Boot Screen
==========================================================*/

#boot{

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

background:#000;

z-index:9999;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

cursor:pointer;

}

#bootTitle{

font-size:34px;

font-weight:bold;

letter-spacing:5px;

color:var(--cyan);

margin-bottom:20px;

}

#bootSub{

font-size:14px;

opacity:.8;

letter-spacing:2px;

}

#bootBuild{

margin-top:15px;

font-size:11px;

opacity:.6;

}

/*==========================================================
    Boot Progress
==========================================================*/

#bootBar{

margin-top:35px;

width:280px;

height:10px;

border:

1px solid var(--cyan);

}

#bootFill{

width:0%;

height:100%;

background:var(--cyan);

transition:.2s;

}

/*==========================================================
    Crosshair
==========================================================*/

#crosshair{

position:fixed;

left:50%;
top:50%;

width:28px;
height:28px;

transform:
translate(-50%,-50%);

pointer-events:none;

z-index:50;

}

#crosshair::before,
#crosshair::after{

content:"";

position:absolute;

background:

rgba(0,242,255,.45);

}

#crosshair::before{

width:28px;
height:2px;

top:13px;
left:0;

}

#crosshair::after{

width:2px;
height:28px;

left:13px;
top:0;

}

/*==========================================================
    Notification
==========================================================*/

#notify{

position:fixed;

top:20px;

left:50%;

transform:
translateX(-50%);

padding:
8px 18px;

background:

rgba(0,0,0,.75);

border:

1px solid var(--cyan);

border-radius:

20px;

font-size:12px;

display:none;

z-index:100;

}
/*==========================================================
    STATUS
==========================================================*/

.statusOK{
color:var(--green);
font-weight:bold;
}

.statusNG{
color:var(--red);
font-weight:bold;
}

.statusWARN{
color:var(--yellow);
font-weight:bold;
}

/*==========================================================
    Layout Width
==========================================================*/

#voicePanel{
width:300px;
min-height:220px;
}

#statusPanel{
width:240px;
}

#memoryPanel{
width:300px;
min-height:170px;
}

#gpsPanel{
width:220px;
}

#sensorPanel{
width:240px;
}

#systemPanel{
width:260px;
}

/*==========================================================
    Clock
==========================================================*/

#clock{

font-size:26px;

font-weight:bold;

color:white;

}

#session{

font-size:13px;

margin-top:6px;

}

/*==========================================================
    Voice Wave
==========================================================*/

#wave{

width:100%;

height:42px;

background:

rgba(255,255,255,.03);

border:

1px solid rgba(0,242,255,.25);

margin-top:8px;

}

/*==========================================================
    Logs
==========================================================*/

.log{

font-size:11px;

line-height:1.5;

color:white;

max-height:120px;

overflow:hidden;

}

/*==========================================================
    Footer
==========================================================*/

#footer{

position:fixed;

bottom:8px;

left:50%;

transform:translateX(-50%);

font-size:10px;

opacity:.55;

letter-spacing:2px;

z-index:100;

}

/*==========================================================
    MODE
==========================================================*/

.mode{

font-size:18px;

font-weight:bold;

color:white;

}

/*==========================================================
    END CSS
==========================================================*/

</style>

</head>
